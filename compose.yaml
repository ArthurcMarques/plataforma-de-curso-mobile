name: plataforma-cursos

services:
  # Banco acessível pela rede interna do Compose; o volume mantém os dados entre recriações.
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: plataforma_cursos
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  # Interface web local para administrar o PostgreSQL; não usa o login da aplicação.
  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD no .env}
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Broker single-node em modo KRaft (sem Zookeeper), só para o evento de boas-vindas do cadastro.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # A API usa postgres como hostname interno e só inicia após o banco ficar saudável.
  # Publicada em todas as interfaces (sem prefixo de IP) para o app mobile acessar pela rede local.
  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://plataforma:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/plataforma_cursos?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      KAFKA_BROKERS: kafka:9092
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      # Não "service_healthy": a API não deve travar no boot se o Kafka demorar a ficar pronto.
      kafka:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Túnel de saída pro Cloudflare: expõe a api publicamente sem abrir porta no roteador/firewall.
  # TUNNEL_TOKEN vem do painel Cloudflare Zero Trust (Networks > Tunnels > seu túnel > token);
  # a rota pública (hostname -> http://api:3000) é configurada lá, não aqui.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN no .env}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Reutiliza o Dockerfile da API, mas executa apenas o Studio neste container.
  prisma-studio:
    build: ./backend
    command: ["./node_modules/.bin/prisma", "studio", "--port", "5555", "--browser", "none"]
    environment:
      DATABASE_URL: postgresql://plataforma:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/plataforma_cursos?schema=public
    ports:
      - '127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555'
    depends_on:
      # A API aplica as migrations antes de ficar saudável.
      api:
        condition: service_healthy

  # Serve o bundle pelo Nginx e encaminha /backend para a API na rede interna.
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
